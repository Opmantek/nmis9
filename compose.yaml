services:
  nmis:
    image: ${NMIS_IMAGE:-public.ecr.aws/n2x4v8j4/firstwave/nmis:9.6.5}
    # Names and ports are variables defaulting to today's values, so a second
    # stack needs only a different .env; see .env. container_name is a
    # host-level label only, kept because CI addresses it literally.
    container_name: ${NMIS_CONTAINER_NAME:-nmis}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      # OMK-12826: the app runs as the scoped nmis9RW user, not the mongo root
      # user. setup_mongodb.pl (run by the entrypoint's setup_db) authenticates
      # as admin using NMIS_DB_ADMIN_*, and creates/updates nmis9RW with the
      # effective NMIS_DB_PASSWORD value. The scoped app secret
      # (MONGODB_APP_PASSWORD) is DISTINCT from the mongo root/admin secret
      # (MONGODB_PASSWORD): set both, to strong distinct values, in .env before
      # the first start.
      NMIS_DB_USERNAME: nmis9RW
      NMIS_DB_PASSWORD: ${MONGODB_APP_PASSWORD}
      NMIS_DB_ADMIN_USERNAME: ${MONGODB_USERNAME}
      NMIS_DB_ADMIN_PASSWORD: ${MONGODB_PASSWORD}
      NMIS_DB_AUTH_SOURCE: nmisng
      # NMIS overrides any config key from NMIS_<KEY> in the environment
      # (NMISNG::Util::_apply_env_overrides). These are the container-side
      # values: do NOT point them at MONGODB_HOST_PORT, which is the host side.
      NMIS_DB_SERVER: ${MONGODB_SERVER:-mongo}
      NMIS_DB_PORT: ${MONGODB_PORT:-27017}
      NMIS_SERVER_NAME: ${NMIS_SERVER_NAME}
      NMIS_CLUSTER_ID: ${NMIS_CLUSTER_ID}
      # Used only when there is no usable password yet, so a restart never resets
      # one changed in the GUI. NOT named NMIS_ADMIN_PASSWORD: NMIS maps NMIS_<KEY>
      # onto config key <key>, which would expose the plaintext in the config.
      NMIS9_ADMIN_PASSWORD: ${NMIS_ADMIN_PASSWORD:-}
      # the docker-secret form. Point it at a mounted secret and leave
      # NMIS_ADMIN_PASSWORD empty, so the password never reaches docker inspect.
      # Setting both is rejected. Example:
      #   secrets: [nmis_admin_password]
      #   NMIS9_ADMIN_PASSWORD_FILE=/run/secrets/nmis_admin_password
      NMIS9_ADMIN_PASSWORD_FILE: ${NMIS_ADMIN_PASSWORD_FILE:-}
      CONTAINER: 1
    depends_on:
      # Wait for mongo to be healthy so the entrypoint's setup_mongodb.pl can
      # provision the scoped nmis9RW user on first boot (OMK-12826).
      mongo:
        condition: service_healthy
    volumes:
      - nmis_log_data:/usr/local/nmis9/logs
      - nmis_var_data:/usr/local/nmis9/var
      - nmis_conf_data:/usr/local/nmis9/conf
      - nmis_database_data:/usr/local/nmis9/database
      - nmis_models_custom:/usr/local/nmis9/models-custom
      # OMK-12827: the encryption-of-secrets master key. The entrypoint
      # generates one on first boot when this volume is empty; an existing
      # key is never touched. Destroying this volume makes every value
      # encrypted under its key permanently undecryptable - back it up like
      # conf/. To supply your own key instead, mount it (e.g. compose
      # secrets:) and set NMIS_MASTER_KEY_FILE=/run/secrets/<name>; the
      # generated key is then ignored. The image must never bake a key at
      # this path: named volumes copy image content on first use, which
      # would hand one shared key to every deployment. The directory also
      # holds the root-only NMIS-<epoch> plaintext backups an enable-eos run
      # writes, so they persist here too.
      - nmis_master_key:/usr/local/etc/firstwave
    ports:
      # 0.0.0.0 is today's behaviour; narrowing the web tier is H14/H15 work.
      - "${NMIS_BIND_ADDR:-0.0.0.0}:${NMIS_HTTP_PORT:-8080}:8080"
      - "${NMIS_BIND_ADDR:-0.0.0.0}:${NMIS_SNMP_PORT:-10001}:161/udp"
    entrypoint: ["tini", "--", "/usr/local/nmis9/docker-entrypoint.sh"]
    networks:
      - nmis_net
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    # host-level label only; the service name is what internal DNS resolves
    container_name: ${MONGO_CONTAINER_NAME:-mongo}
    platform: linux/amd64
    restart: always
    healthcheck:
      # probes the service name, so a loopback-only mongod shows as unhealthy
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:${MONGODB_PORT:-27017}/test --quiet
      # Fast probe so `depends_on: service_healthy` gates nmis startup quickly and
      # the entrypoint's setup_mongodb.pl provisions the scoped user (OMK-12826).
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_log:/var/log/mongodb
      - ./conf-default/docker/mongo/mongod.conf:/etc/mongod.conf
    ports:
      # Loopback by default; Docker publishing bypasses the host firewall.
      # See .env before changing MONGODB_BIND_ADDR.
      - "${MONGODB_BIND_ADDR:-127.0.0.1}:${MONGODB_HOST_PORT:-27017}:${MONGODB_PORT:-27017}"
    # --port overrides mongod.conf, making MONGODB_PORT the single source of
    # truth for the container port.
    command: ["mongod", "--auth", "--config", "/etc/mongod.conf", "--port", "${MONGODB_PORT:-27017}"]
    networks:
      - nmis_net
networks:
  nmis_net:
volumes:
  nmis_log_data:
  nmis_var_data:
  nmis_conf_data:
  nmis_database_data:
  nmis_models_custom:
  nmis_master_key:
  mongo_data:
  mongo_log: