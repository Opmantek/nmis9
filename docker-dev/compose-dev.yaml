 # compose.yaml file for NMIS
#
# Names and ports are variables defaulting to today's values, so a second dev
# stack needs only a different env file; see .env-dev. The container_name
# values are host-level labels only, kept because CI addresses them literally.
services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    container_name: ${MONGO_CONTAINER_NAME:-mongo}
    platform: linux/amd64
    restart: always
    healthcheck:
      # probes the service name, so a loopback-only mongod shows as unhealthy
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:${MONGODB_PORT:-27017}/test --quiet
      interval: 60s
      timeout: 60s
      retries: 5
      start_period: 60s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - mongo_log:/var/log/mongodb
      - ../conf-default/docker/mongo/mongod.conf:/etc/mongod.conf
    ports:
      # Loopback by default: host-side test runs still reach 127.0.0.1:27017,
      # but nothing else on the network can. See .env-dev.
      - "${MONGODB_BIND_ADDR:-127.0.0.1}:${MONGODB_HOST_PORT:-27017}:${MONGODB_PORT:-27017}"
    # --port overrides mongod.conf, making MONGODB_PORT the single source of
    # truth for the container port.
    command: ["mongod", "--auth", "--config", "/etc/mongod.conf", "--port", "${MONGODB_PORT:-27017}"]
    networks:
      - nmis_net
  nmis:
    image: ${NMIS_IMAGE:-crg.apkg.io/firstwavecloud/nmis-dev:latest}
    container_name: ${NMIS_CONTAINER_NAME:-nmis}
    platform: linux/amd64
    restart: always
    environment:
      # OMK-12826: the container runs as the scoped app user, not the mongo
      # root user. setup_mongodb.pl (run by the entrypoint's setup_db)
      # authenticates as admin using the NMIS_DB_ADMIN_* pair below, and
      # creates/updates nmis9RW with the effective NMIS_DB_PASSWORD value.
      # Because setup honours a supplied, non-default password rather than
      # generating one, the app's runtime password and the created user's
      # password match with no conflict.
      NMIS_DB_USERNAME: nmis9RW
      NMIS_DB_PASSWORD: ${MONGODB_PASSWORD}
      NMIS_DB_ADMIN_USERNAME: ${MONGODB_USERNAME}
      NMIS_DB_ADMIN_PASSWORD: ${MONGODB_PASSWORD}
      NMIS_DB_AUTH_SOURCE: nmisng
      # NMIS overrides any config key from NMIS_<KEY> in the environment
      # (NMISNG::Util::_apply_env_overrides). These are the container-side
      # values: do NOT point them at MONGODB_HOST_PORT, which is the host side.
      NMIS_DB_SERVER: ${MONGODB_SERVER:-mongo}
      NMIS_DB_PORT: ${MONGODB_PORT:-27017}
      NMIS_SERVER_NAME: ${NMIS_SERVER_NAME}
      NMIS_CLUSTER_ID: ${NMIS_CLUSTER_ID}
      # Used only when there is no usable password yet. NOT named
      # NMIS_ADMIN_PASSWORD: NMIS maps NMIS_<KEY> onto config key <key>.
      NMIS9_ADMIN_PASSWORD: ${NMIS_ADMIN_PASSWORD:-}
      # docker-secret form, see compose.yaml. Setting both is rejected.
      NMIS9_ADMIN_PASSWORD_FILE: ${NMIS_ADMIN_PASSWORD_FILE:-}
      DEV_UID: ${DEV_UID}
      DEV_GID: ${DEV_GID}
      CONTAINER: 1
    depends_on:
      - mongo
    volumes:
      - ../:/usr/local/nmis9
    ports:
      # 0.0.0.0 is today's behaviour; narrowing the web tier is H14/H15 work.
      - "${NMIS_BIND_ADDR:-0.0.0.0}:${NMIS_HTTP_PORT:-8080}:8080"
      - "${NMIS_BIND_ADDR:-0.0.0.0}:${NMIS_SNMP_PORT:-10001}:161/udp"
    networks:
      - nmis_net
networks:
  nmis_net:
volumes:
  mongo_data:
  mongo_log: