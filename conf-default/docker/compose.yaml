# compose.yaml file for NMIS Suite
#
# OMK-12708. Every host-visible name and port is a variable with today's value
# as the default, so a second stack on the same host only needs a different env
# file. Volumes and the network are already isolated, because compose prefixes
# them with the project name: set COMPOSE_PROJECT_NAME to separate two stacks
# started from the same directory. This file sets no container_name, so the
# containers are named <project>-<service>-<n> and never collide.
services:
  nmis:
    image: ${NMIS_IMAGE:-public.ecr.aws/n2x4v8j4/firstwave/nmis9:9.6.5}
    restart: always
    environment:
      NMIS_DB_USERNAME: ${MONGODB_USERNAME}
      NMIS_DB_PASSWORD: ${MONGODB_PASSWORD}
      # OMK-12708. NMIS overrides any config key from NMIS_<KEY> in the
      # environment (Util.pm:1140 matches /^NMIS_(.+)$/ and lowercases the
      # suffix), so these set db_server and db_port without editing Config.nmis.
      #
      # Both are the CONTAINER-side values, which is how the app reaches Mongo
      # across nmis_net. Do NOT wire NMIS_DB_PORT to MONGODB_HOST_PORT: that is
      # the host side of the published mapping, and the app would dial a port
      # mongod is not listening on inside the network.
      NMIS_DB_SERVER: ${MONGODB_SERVER:-mongo}
      NMIS_DB_PORT: ${MONGODB_PORT:-27017}
      NMIS_SERVER_NAME: ${NMIS_SERVER_NAME}
    depends_on:
      - mongo
    volumes:
      - nmis_log_data:/usr/local/nmis9/logs
      - nmis_var_data:/usr/local/nmis9/var
      - nmis_conf_data:/usr/local/nmis9/conf
      - nmis_database_data:/usr/local/nmis9/database
      - nmis_models_custom:/usr/local/nmis9/models-custom
    ports:
      # The 0.0.0.0 default is today's behaviour, deliberately unchanged here.
      # Narrowing the web tier belongs with H14/H15 (OMK-12710, OMK-12711).
      - "${NMIS_BIND_ADDR:-0.0.0.0}:${NMIS_HTTP_PORT:-8080}:8080"
    networks:
      - nmis_net
  mongo:
    image: ${MONGO_IMAGE:-mongo:7.0}
    restart: always
    healthcheck:
      # probes the service name, not localhost, so a mongod bound only to
      # loopback shows up as an unhealthy container (OMK-12708)
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:${MONGODB_PORT:-27017}/test --quiet
      interval: 60s
      timeout: 60s
      retries: 5
      start_period: 60s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
    volumes:
      - mongo_data:/data/mongodb
      - mongo_log:/var/log/mongodb
      - ./mongo/mongod.conf:/etc/mongod.conf
    ports:
      # OMK-12708. Defaults to loopback so the database is not published on
      # every interface. Docker port publishing bypasses the host firewall, so
      # "27017:27017" exposed Mongo regardless of any iptables or ufw rules.
      # Override MONGODB_BIND_ADDR and MONGODB_HOST_PORT in .env to change the
      # address or port; .env carries the warning that goes with opening it up.
      - "${MONGODB_BIND_ADDR:-127.0.0.1}:${MONGODB_HOST_PORT:-27017}:${MONGODB_PORT:-27017}"
    # --port comes last deliberately: it overrides the port in mongod.conf, so
    # MONGODB_PORT is the single source of truth for the container-side port and
    # cannot drift from what the mapping targets or what NMIS_DB_PORT tells the
    # app (OMK-12708).
    command: ["mongod", "--auth", "--config", "/etc/mongod.conf", "--port", "${MONGODB_PORT:-27017}"]
    networks:
      - nmis_net
networks:
  nmis_net:
volumes:
  nmis_log_data:
  nmis_var_data:
  nmis_conf_data:
  nmis_database_data:
  nmis_models_custom:
  mongo_data:
  mongo_log: