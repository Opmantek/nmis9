---
net:
  # OMK-12708. Listen on loopback plus this container's own address on the
  # compose network, not on every interface. "mongo" is the compose service
  # name, so inside the container it resolves via Docker's embedded DNS to
  # the container's address on nmis_net, and mongod re-resolves it at every
  # start, so a changed container address is picked up automatically.
  #
  # Do NOT reduce this to "localhost". The nmis container reaches the database
  # at mongo:27017 across the compose network, so a loopback-only mongod is
  # unreachable to it. The mongo healthcheck in the compose files connects to
  # mongo:27017 and so exercises this network listener rather than loopback,
  # which means that mistake shows up as an unhealthy container rather than
  # silently, but it still costs a failed deployment to find out.
  bindIp: localhost,mongo
  # Fallback only. The compose files pass "--port ${MONGODB_PORT:-27017}" on the
  # mongod command line, which overrides this, so MONGODB_PORT is the single
  # source of truth for the container port under compose (OMK-12708). This value
  # applies when mongod is run against this file without that flag.
  port: 27017
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
security:
  authorization: enabled
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.00
systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log