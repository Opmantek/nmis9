---
net:
  # Loopback plus this container's own address on the compose network, not
  # every interface. "mongo" is the compose service name and is re-resolved at
  # each start. Do NOT reduce this to "localhost": the app reaches the database
  # across the compose network, so loopback-only makes it unreachable.
  bindIp: localhost,mongo
  # Fallback only: the compose files pass --port, which overrides this.
  port: 27017
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
security:
  authorization: enabled
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1.00
systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log