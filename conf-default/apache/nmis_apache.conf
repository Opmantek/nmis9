# Apache 2.2+ configuration snippet for NMIS

# this should either be made part of your preferred VirtualHost,
# or saved in /etc/apache2/sites-enabled as <somefile>.conf

# Further documentation about Apache: http://httpd.apache.org/docs/2.2/

# Aliases for static files:
Alias /nmis9 "/usr/local/nmis9/htdocs"
# but make the landing page the main dashboard
RedirectMatch permanent "^/nmis9/$" "/cgi-nmis9/nmiscgi.pl"

<Directory "/usr/local/nmis9/htdocs">
		Options FollowSymLinks MultiViews
		AllowOverride None
		Order allow,deny
		Allow from all
</Directory>

Alias /menu9/ "/usr/local/nmis9/menu/"
<Directory "/usr/local/nmis9/menu">
		Options FollowSymLinks MultiViews
		AllowOverride None
		Order allow,deny
		Allow from all
</Directory>

ScriptAlias /cgi-nmis9/ "/usr/local/nmis9/cgi-bin/"
<Directory "/usr/local/nmis9/cgi-bin">
		Options +ExecCGI
		Order allow,deny
		Allow from all
</Directory>

<IfModule mod_headers.c>
  # Security headers (OMK-12711).
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), interest-cohort=(), browsing-topics=()"
  # Report-only CSP: violations are logged in browser devtools. No report-uri is set because
  # no collection endpoint exists yet; add one before switching to enforcing mode.
  # unsafe-eval required by underscore.js _.template() and cytoscape-pdf-export (jsPDF).
  # Removing it needs _.template() → template literals + a CSP-safe PDF export library (OMK-12702/12703).
  # HSTS withheld until TLS is live (OMK-12710).
  Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
</IfModule>

