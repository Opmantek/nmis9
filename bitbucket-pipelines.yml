image: atlassian/default-image:4
clone:
  depth: 1 # Perform a shallow clone with only the latest commit

pipelines:
  branches:
    '**':
      - step:
          name: Sanitise Work Environment
          runs-on:
            - self.hosted
            - linux.shell
            - fwbb.runner2
          script:
            - ci/scripts/runner_cleanup.sh
      - step:
          name: Setup NMIS
          runs-on:
            - self.hosted
            - linux.shell
            - fwbb.runner2
          script:
            - mkdir $WORKING_DIRECTORY/build
            - cp -a "$BITBUCKET_CLONE_DIR" "$WORKING_DIRECTORY/build/nmis9"
            - cd $WORKING_DIRECTORY/build/nmis9
            # The runner injects "umask 000" before cloning, so the checkout is
            # world-writable. This tree is bind-mounted at /usr/local/nmis9, and
            # NMIS refuses to eval a world-writable config or model file
            # (OMK-12696), which fails every collect and every test. The
            # container runs as DEV_UID/DEV_GID below, i.e. this same user, so
            # dropping other-write costs it nothing.
            - chmod -R o-w .
            - sed -i "s/^DEV_UID=.*/DEV_UID=$(id -u)/; s/^DEV_GID=.*/DEV_GID=$(id -g)/" docker-dev/.env-dev
            - echo "$BB_PKG_TOKEN" | docker login crg.apkg.io -u "$BB_EMAIL" --password-stdin
            - docker compose --file docker-dev/compose-dev.yaml --env-file docker-dev/.env-dev up -d
            # OMK-12826: `up -d` returns before the entrypoint's setup_mongodb.pl
            # has provisioned the scoped nmis9RW user, so the Test step could race
            # it. Wait until the app can actually authenticate before proceeding.
            - |
              for i in $(seq 1 48); do
                if docker exec nmis bash -c 'mongosh "mongodb://$NMIS_DB_USERNAME:$NMIS_DB_PASSWORD@$NMIS_DB_SERVER:$NMIS_DB_PORT/?authSource=$NMIS_DB_AUTH_SOURCE" --quiet --eval "db.runCommand({ping:1})" >/dev/null 2>&1'; then
                  echo "nmis scoped DB user ready after ~$((i*5))s"; ready=1; break
                fi
                echo "waiting for nmis DB provisioning ($i)..."; sleep 5
              done
              [ -n "$ready" ] || { echo "ERROR: nmis DB user not ready in time"; docker logs --tail 100 nmis || true; exit 1; }
      - step:
          name: Test NMIS
          runs-on:
            - self.hosted
            - linux.shell
            - fwbb.runner2
          script:
            - echo "$HOME/dockerhost.json"
            - docker cp $HOME/dockerhost.json nmis:/usr/local/nmis9/
            - docker exec nmis bash -c "ls -la /usr/local/nmis9/dockerhost.json"
            - docker exec nmis bash -c "/usr/local/nmis9/admin/node_admin.pl act=import file=/usr/local/nmis9/dockerhost.json"
            # extra nodes so multi-node tests (e.g. t_event.pl needs >=3) have enough to run
            - docker exec nmis bash -c "/usr/local/nmis9/admin/node_admin.pl act=import file=/usr/local/nmis9/ci/fixtures/ci-testnode-2.json"
            - docker exec nmis bash -c "/usr/local/nmis9/admin/node_admin.pl act=import file=/usr/local/nmis9/ci/fixtures/ci-testnode-3.json"
            # OMK-12826: the suite spins up throwaway t_<name>-<timestamp> databases,
            # which the scoped runtime user (nmis9RW, dbOwner on nmisng only) is not
            # authorized to create. Run the suite as the admin identity already present
            # in the container (NMIS_DB_ADMIN_*); the app process itself stays scoped.
            - docker exec nmis bash -c 'NMIS_DB_USERNAME="$NMIS_DB_ADMIN_USERNAME" NMIS_DB_PASSWORD="$NMIS_DB_ADMIN_PASSWORD" NMIS_DB_AUTH_SOURCE=admin /usr/local/nmis9/ci/scripts/perl_tests.sh'
          after-script:
            - ci/scripts/runner_cleanup.sh  
  custom:
    release-dev-image:
      - step:
          name: Release NMIS Development Image
          runs-on:
            - self.hosted
            - linux.shell
            - fwbb.runner2
          script:
            - SHORT_SHA="$(echo "$BITBUCKET_COMMIT" | cut -c1-7)"
            - SEM_VER="$(sed -nE 's/.*\$VERSION = "([0-9.]+)";/\1/p' bin/nmisd)"
            - echo "SHORT_SHA $SHORT_SHA"
            - echo "SEM_VER $SEM_VER"
            - echo "$BB_PKG_TOKEN" | docker login crg.apkg.io -u "$BB_EMAIL" --password-stdin
            - docker build --no-cache --tag "$BB_PKG_REPO/nmis-dev:$SEM_VER" -f docker-dev/dockerfile-dev .
            - docker tag "$BB_PKG_REPO/nmis-dev:$SEM_VER" "$BB_PKG_REPO/nmis-dev:$SEM_VER-$SHORT_SHA"
            - docker tag "$BB_PKG_REPO/nmis-dev:$SEM_VER" "$BB_PKG_REPO/nmis-dev:latest"
            - docker push "$BB_PKG_REPO/nmis-dev:$SEM_VER"
            - docker push "$BB_PKG_REPO/nmis-dev:$SEM_VER-$SHORT_SHA"
            - docker push "$BB_PKG_REPO/nmis-dev:latest"
    release-prod-image:
      - step:
          name: Release NMIS ECR Image
          runs-on:
            - self.hosted
            - linux.shell
            - fwbb.runner2
          script:
            - SEM_VER="$(sed -nE 's/.*\$VERSION = "([0-9.]+)";/\1/p' bin/nmisd)"
            - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$OP_ECR"
            - docker build --no-cache -t "$OP_ECR/nmis:$SEM_VER" -f docker/docker-prod/dockerfile-prod .
            - docker push -t "$OP_ECR/nmis:$SEM_VER"